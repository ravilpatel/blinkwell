name: Dashboard CI & Lint

on:
  push:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  pull_request:
    paths:
      - 'dashboard/**'
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build & Verify Next.js Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build
